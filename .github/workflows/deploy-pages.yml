name: Deploy offline apps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf site
          mkdir site
          unzip -q academic-company-offline-bundle-v7.zip -d site

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Offline Apps</title>
            <style>
              body {
                font-family: sans-serif;
                max-width: 720px;
                margin: 0 auto;
                padding: 32px 20px;
                line-height: 1.6;
              }
              a {
                display: block;
                padding: 16px;
                margin: 12px 0;
                border: 1px solid #ccc;
                border-radius: 12px;
                text-decoration: none;
              }
            </style>
          </head>
          <body>
            <h1>Offline Apps</h1>
            <p>ローカル動作用アプリ</p>

            <a href="./academic-institute/">
              🏛️ 学術機構
            </a>

            <a href="./company-internal/">
              🏢 COMPANY INTERNAL
            </a>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
