name: Deploy offline apps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf site
          mkdir site

          unzip -q academic-company-offline-bundle-v26.zip -d site

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#102A43">
            <link rel="manifest" href="./manifest.json">
            <title>Offline Apps</title>
            <style>
              body {
                font-family: sans-serif;
                max-width: 720px;
                margin: 0 auto;
                padding: 32px 20px;
                line-height: 1.6;
              }

              a {
                display: block;
                padding: 16px;
                margin: 12px 0;
                border: 1px solid #ccc;
                border-radius: 12px;
                text-decoration: none;
              }
            </style>
          </head>

          <body>
            <h1>Offline Apps</h1>
            <p>ローカル動作用アプリ</p>

            <a href="./academic-institute/">
              🏛️ 学術機構
            </a>

            <a href="./company-internal/company-v1/">
              🏢 COMPANY INTERNAL
            </a>

            <script>
              if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                  navigator.serviceWorker.register('./sw.js', {
                    scope: './'
                  }).catch(console.warn);
                });
              }
            </script>
          </body>
          </html>
          EOF

          cat > site/manifest.json <<'EOF'
          {
            "name": "Offline Apps",
            "short_name": "Offline Apps",
            "lang": "ja",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#F5F7F9",
            "theme_color": "#102A43",
            "icons": []
          }
          EOF

          ASSETS=$(find site -type f ! -name 'sw.js' | sed 's#^site/#./#' | jq -R -s 'split("\n") | map(select(length > 0))')

          cat > site/sw.js <<EOF
          const CACHE_NAME = 'offline-apps-root-v26';

          const ASSETS = $ASSETS;

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then(cache => cache.addAll(ASSETS))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys()
                .then(keys =>
                  Promise.all(
                    keys
                      .filter(key => key !== CACHE_NAME)
                      .map(key => caches.delete(key))
                  )
                )
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', event => {
            const request = event.request;

            if (request.method !== 'GET') {
              return;
            }

            event.respondWith(
              caches.match(request)
                .then(cached => {
                  if (cached) {
                    return cached;
                  }

                  return fetch(request)
                    .then(response => {
                      const copy = response.clone();

                      caches.open(CACHE_NAME)
                        .then(cache => cache.put(request, copy));

                      return response;
                    })
                    .catch(() => {
                      if (request.mode === 'navigate') {
                        return caches.match('./index.html');
                      }

                      return undefined;
                    });
                })
            );
          });
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
